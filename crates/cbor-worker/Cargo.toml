[package]
name = "cbor-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VGI worker exposing CBOR / MessagePack / COSE / CWT / WebAuthn decode & encode functions to DuckDB over Apache Arrow"

[lib]
name = "cbor_worker"
path = "src/lib.rs"

[[bin]]
name = "cbor-worker"
path = "src/main.rs"

[dependencies]
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
cbor-core.workspace = true
# Used directly by the encode paths (value_in.rs / msgpack.rs) to build the
# dynamic CBOR / MessagePack `Value` from Arrow cells. Same versions the core
# crate resolves, so no duplicate-tree concern.
ciborium = "0.2.2"
rmpv = "1.3"
log = "0.4"
# Cloud object-store access for the COPY formats' s3:// and http(s):// paths.
# `object_store` is arrow-independent, so it does not disturb the arrow-59 pin.
url = "2"
percent-encoding = "2"
bytes = "1"
# Glob expansion for multi-file COPY sources: DuckDB's S3 semantics keep `*`,
# `?` and `[…]` inside one key segment, which `glob::MatchOptions` models.
glob = "0.3"
futures = "0.3"

# --- Native ---------------------------------------------------------------
# The SDK's real default features — unchanged from before the wasm split.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vgi = { workspace = true, features = ["sqlite", "transport-http"] }
vgi-rpc = { workspace = true, features = ["http"] }
env_logger = "0.11"
# tokio drives the async object_store calls from this synchronous worker; see
# `cloud::block_on` for how it cooperates with the transport's ambient runtime.
object_store = { version = "0.14", features = ["aws", "http"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# --- wasm32 ---------------------------------------------------------------
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs. No env_logger.
[target.'cfg(target_arch = "wasm32")'.dependencies]
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }
# `aws`/`http` pull reqwest+rustls (sockets) and aws-lc-rs (C/asm), none of which
# build for wasm. The `-base` features are the same S3/HTTP code *without* a
# bundled transport or crypto provider; src/wasm/ supplies both (sync-XHR
# HttpService + sha2/hmac CryptoProvider). tokio is rt+time only — no I/O driver
# is needed since the XHR transport blocks inline, but `time` is required for
# object_store's retry backoff.
object_store = { version = "0.14", default-features = false, features = [
    "aws-base",
    "http-base",
] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
async-trait = "0.1"
http = "1"
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
cbor-core = { workspace = true }
